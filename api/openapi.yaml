openapi: 3.0.3
info:
  title: GANI Log API
  version: 1.0.0
  description: |
    스쿠버 다이빙 기록 관리 서비스 GANI Log의 API 명세입니다.
    SAC는 bar/min, RMV는 L/min 단위를 사용합니다.
servers:
  - url: /api/v1
    description: 현재 호스트의 API v1

tags:
  - name: Auth
    description: 회원가입과 로그인
  - name: Profile
    description: 내 정보와 자격증 관리
  - name: Dive Computers
    description: 다이브 컴퓨터 관리
  - name: Imports
    description: 다이빙 기록 파일·이미지 가져오기
  - name: Dive Logs
    description: 다이빙 로그 작성과 조회
  - name: Friends
    description: 친구 관계와 버디 로그 공유
  - name: Equipment
    description: 개인·렌탈 장비 관리
  - name: Dashboard
    description: 대시보드 요약

security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 회원가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      operationId: logIn
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: 내 정보 조회
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: 내 정보 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 수정된 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/certifications:
    get:
      tags: [Profile]
      operationId: listMyCertifications
      summary: 내 자격증 목록 조회
      responses:
        '200':
          description: 자격증 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certification'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Profile]
      operationId: createMyCertification
      summary: 자격증 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationInput'
      responses:
        '201':
          description: 등록된 자격증
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/certifications/{certificationId}:
    parameters:
      - $ref: '#/components/parameters/CertificationId'
    patch:
      tags: [Profile]
      operationId: updateMyCertification
      summary: 자격증 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationInput'
      responses:
        '200':
          description: 수정된 자격증
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Profile]
      operationId: deleteMyCertification
      summary: 자격증 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dive-computers:
    get:
      tags: [Dive Computers]
      operationId: listDiveComputers
      summary: 연동 기기 목록 조회
      responses:
        '200':
          description: 다이브 컴퓨터 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiveComputer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Dive Computers]
      operationId: createDiveComputer
      summary: 연동 기기 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiveComputerInput'
      responses:
        '201':
          description: 등록된 다이브 컴퓨터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveComputer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dive-computers/{diveComputerId}:
    parameters:
      - $ref: '#/components/parameters/DiveComputerId'
    patch:
      tags: [Dive Computers]
      operationId: updateDiveComputer
      summary: 연동 기기 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiveComputerInput'
      responses:
        '200':
          description: 수정된 다이브 컴퓨터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveComputer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Dive Computers]
      operationId: deleteDiveComputer
      summary: 연동 기기 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /imports:
    post:
      tags: [Imports]
      operationId: createImport
      summary: 다이빙 기록 가져오기
      description: |
        블루투스 연결 또는 파일 업로드로 다이빙 기록을 가져옵니다.
        파일 업로드에서는 FIT, CSV와 JPG, PNG, WEBP, HEIC, HEIF 형식을 받습니다.
        이미지 분석 결과는 사용자가 확인·수정한 뒤 로그로 저장해야 합니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateImportRequest'
            encoding:
              method:
                contentType: text/plain
              diveComputerId:
                contentType: text/plain
              file:
                contentType: application/octet-stream, text/csv, image/jpeg, image/png, image/webp, image/heic, image/heif
      responses:
        '202':
          description: 가져오기 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /imports/{importSessionId}:
    get:
      tags: [Imports]
      operationId: getImport
      summary: 가져오기 처리 상태와 확인 데이터 조회
      parameters:
        - $ref: '#/components/parameters/ImportSessionId'
      responses:
        '200':
          description: 처리 상태와 추출된 다이빙 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dive-logs:
    get:
      tags: [Dive Logs]
      operationId: listDiveLogs
      summary: 다이빙 로그 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: divePoint
          in: query
          description: 다이빙 포인트 이름 검색어
          schema:
            type: string
        - name: dateFrom
          in: query
          description: 조회 시작일
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: 조회 종료일
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 다이빙 로그 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Dive Logs]
      operationId: createDiveLog
      summary: 다이빙 로그 작성
      description: SAC와 RMV는 입력값을 기준으로 서버에서 계산해 응답합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiveLogWriteRequest'
      responses:
        '201':
          description: 작성된 다이빙 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /feed:
    get:
      tags: [Friends]
      operationId: listSharedDiveLogs
      summary: 친구와 공개 로그 피드 조회
      description: 수락된 친구가 friends 또는 public으로 공개한 로그와 전체 공개 로그를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 열람 가능한 공유 로그 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends:
    get:
      tags: [Friends]
      operationId: listFriends
      summary: 친구 목록 조회
      responses:
        '200':
          description: 수락된 친구 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /friends/{friendId}:
    delete:
      tags: [Friends]
      operationId: deleteFriend
      summary: 친구 삭제
      parameters:
        - $ref: '#/components/parameters/FriendId'
      responses:
        '204':
          description: 친구 관계 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /friend-requests:
    get:
      tags: [Friends]
      operationId: listFriendRequests
      summary: 받은 친구 요청 목록 조회
      responses:
        '200':
          description: 대기 중인 친구 요청 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Friends]
      operationId: createFriendRequest
      summary: 이메일로 친구 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriendRequest'
      responses:
        '201':
          description: 생성된 친구 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /friend-requests/{friendRequestId}/accept:
    post:
      tags: [Friends]
      operationId: acceptFriendRequest
      summary: 친구 요청 수락
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '200':
          description: 수락된 친구 관계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /friend-requests/{friendRequestId}:
    delete:
      tags: [Friends]
      operationId: rejectFriendRequest
      summary: 친구 요청 거절 또는 보낸 요청 취소
      parameters:
        - $ref: '#/components/parameters/FriendRequestId'
      responses:
        '204':
          description: 요청 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/dive-logs/{diveLogId}:
    get:
      tags: [Dive Logs]
      operationId: getPublicDiveLog
      summary: 전체 공개 로그 조회
      description: 공개 범위가 public인 로그만 로그인 없이 조회할 수 있습니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/DiveLogId'
      responses:
        '200':
          description: 전체 공개 다이빙 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /dive-logs/{diveLogId}:
    parameters:
      - $ref: '#/components/parameters/DiveLogId'
    get:
      tags: [Dive Logs]
      operationId: getDiveLog
      summary: 다이빙 로그 상세 조회
      responses:
        '200':
          description: 다이빙 로그 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Dive Logs]
      operationId: updateDiveLog
      summary: 다이빙 로그 수정
      description: 계산에 쓰이는 값이 변경되면 SAC와 RMV도 다시 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiveLogWriteRequest'
      responses:
        '200':
          description: 수정된 다이빙 로그
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiveLogDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Dive Logs]
      operationId: deleteDiveLog
      summary: 다이빙 로그 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dive-logs/{diveLogId}/similar:
    get:
      tags: [Dive Logs]
      operationId: listSimilarDiveLogs
      summary: 유사 조건의 과거 로그 비교
      description: 현재 로그와 비교할 과거 기록과 SAC·RMV 차이를 반환합니다.
      parameters:
        - $ref: '#/components/parameters/DiveLogId'
      responses:
        '200':
          description: 유사 기록 비교 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimilarDiveLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /equipment:
    get:
      tags: [Equipment]
      operationId: listEquipment
      summary: 등록 장비 목록 조회
      parameters:
        - name: category
          in: query
          description: 장비 종류
          schema:
            $ref: '#/components/schemas/EquipmentCategory'
      responses:
        '200':
          description: 장비 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Equipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Equipment]
      operationId: createEquipment
      summary: 장비 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
      responses:
        '201':
          description: 등록된 장비
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentId'
    get:
      tags: [Equipment]
      operationId: getEquipment
      summary: 장비 상세 조회
      responses:
        '200':
          description: 장비 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Equipment]
      operationId: updateEquipment
      summary: 장비 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentInput'
      responses:
        '200':
          description: 수정된 장비
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Equipment]
      operationId: deleteEquipment
      summary: 장비 삭제
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: 대시보드 요약 조회
      responses:
        '200':
          description: 누적 기록과 최근 다이빙 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CertificationId:
      name: certificationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DiveComputerId:
      name: diveComputerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ImportSessionId:
      name: importSessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DiveLogId:
      name: diveLogId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FriendId:
      name: friendId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FriendRequestId:
      name: friendRequestId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 입력값이 올바르지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 인증 정보가 없거나 유효하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 요청한 데이터를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 이미 존재하는 데이터와 충돌함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 지원하지 않는 파일 형식
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SignUpRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [accessToken, tokenType, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required: [id, email, displayName, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        profileImageUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        profileImageUrl:
          type: string
          format: uri
          nullable: true

    CertificationInput:
      type: object
      required: [agency, level]
      properties:
        agency:
          type: string
          description: 발급 단체
        level:
          type: string
          description: 자격 등급
        certificationNumber:
          type: string
          nullable: true
        issuedOn:
          type: string
          format: date
          nullable: true

    Certification:
      allOf:
        - $ref: '#/components/schemas/CertificationInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DiveComputerInput:
      type: object
      required: [manufacturer, modelName]
      properties:
        manufacturer:
          type: string
        modelName:
          type: string
        serialNumber:
          type: string
          nullable: true

    DiveComputer:
      allOf:
        - $ref: '#/components/schemas/DiveComputerInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ImportMethod:
      type: string
      enum: [bluetooth, file, manufacturer_account]

    ImportStatus:
      type: string
      enum: [pending, processing, completed, failed]

    CreateImportRequest:
      type: object
      required: [method]
      properties:
        method:
          $ref: '#/components/schemas/ImportMethod'
        diveComputerId:
          type: integer
          format: int64
          nullable: true
          description: 블루투스로 가져올 때 선택한 연동 기기 ID
        file:
          type: string
          format: binary
          nullable: true
          description: 파일 방식일 때 전송할 FIT, CSV 또는 이미지 파일

    ImportSession:
      type: object
      required: [id, method, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/ImportMethod'
        status:
          $ref: '#/components/schemas/ImportStatus'
        originalFileName:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ImportSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ImportSession'
        - type: object
          properties:
            extractedLog:
              allOf:
                - $ref: '#/components/schemas/DiveLogWriteRequest'
              nullable: true

    DiveLogBase:
      type: object
      required:
        - divePoint
        - divedOn
        - durationMinutes
        - averageDepthM
        - maximumDepthM
      properties:
        divePoint:
          type: string
          minLength: 1
          maxLength: 200
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
          description: ISO 3166-1 alpha-2 국가 코드
        region:
          type: string
          nullable: true
        divedOn:
          type: string
          format: date
        startedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          minimum: 1
        averageDepthM:
          type: number
          format: double
          minimum: 0
          description: 평균 수심(m)
        maximumDepthM:
          type: number
          format: double
          minimum: 0
          description: 최대 수심(m). 평균 수심 이상이어야 합니다.
        waterTemperatureC:
          type: number
          format: double
          nullable: true
        memo:
          type: string
          nullable: true
        visibility:
          $ref: '#/components/schemas/LogVisibility'

    LogVisibility:
      type: string
      enum: [private, friends, public]
      default: private
      description: 'private: 작성자만, friends: 수락된 친구만, public: 누구나 열람'

    GasMetricsInput:
      type: object
      required: [tankVolumeL, startPressureBar, endPressureBar]
      properties:
        tankVolumeL:
          type: number
          format: double
          minimum: 0.1
          default: 11
          description: 탱크 용량(L). 기본값은 11L이며 수정할 수 있습니다.
        startPressureBar:
          type: number
          format: double
          minimum: 0
        endPressureBar:
          type: number
          format: double
          minimum: 0
          description: 시작 압력 이하여야 합니다.

    GasMetrics:
      allOf:
        - $ref: '#/components/schemas/GasMetricsInput'
        - type: object
          required: [sacBarPerMin, rmvLPerMin, interpretation]
          properties:
            sacBarPerMin:
              type: number
              format: double
              description: 수면 환산 압력 소비율(bar/min)
            rmvLPerMin:
              type: number
              format: double
              description: 수면 환산 호흡량(L/min)
            interpretation:
              type: string
              description: 유사 조건의 본인 기록을 기준으로 한 수치 설명

    DiveConditions:
      type: object
      properties:
        waterType:
          type: string
          enum: [sea, fresh]
          nullable: true
        currentStrength:
          type: string
          enum: [none, weak, moderate, strong]
          nullable: true
        visibilityM:
          type: number
          format: double
          minimum: 0
          nullable: true
        conditionLevel:
          type: string
          enum: [low, moderate, high]
          nullable: true
        note:
          type: string
          nullable: true

    DiveWeighting:
      type: object
      properties:
        weightKg:
          type: number
          format: double
          minimum: 0
          nullable: true
        assessment:
          type: string
          enum: [light, appropriate, heavy]
          nullable: true
        note:
          type: string
          nullable: true

    EquipmentCategory:
      type: string
      enum: [suit, bcd, regulator, fins, mask, dive_computer, other]

    EquipmentSource:
      type: string
      enum: [personal, rental]

    EquipmentInput:
      type: object
      required: [category, name]
      properties:
        category:
          $ref: '#/components/schemas/EquipmentCategory'
        name:
          type: string
          minLength: 1
          maxLength: 200
        subtype:
          type: string
          nullable: true
          description: 웻·드라이 슈트, 조끼형·백 인플레이트형 BCD와 같은 세부 유형
        brand:
          type: string
          nullable: true
        modelName:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    Equipment:
      allOf:
        - $ref: '#/components/schemas/EquipmentInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DiveLogEquipmentInput:
      type: object
      required: [source, category, name]
      properties:
        equipmentId:
          type: integer
          format: int64
          nullable: true
          description: 개인 등록 장비를 선택한 경우의 장비 ID
        source:
          $ref: '#/components/schemas/EquipmentSource'
        category:
          $ref: '#/components/schemas/EquipmentCategory'
        name:
          type: string
        subtype:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    DiveLogWriteRequest:
      allOf:
        - $ref: '#/components/schemas/DiveLogBase'
        - type: object
          required: [gasMetrics]
          properties:
            importSessionId:
              type: integer
              format: int64
              nullable: true
            gasMetrics:
              $ref: '#/components/schemas/GasMetricsInput'
            conditions:
              $ref: '#/components/schemas/DiveConditions'
            weighting:
              $ref: '#/components/schemas/DiveWeighting'
            equipment:
              type: array
              items:
                $ref: '#/components/schemas/DiveLogEquipmentInput'
            buddyUserIds:
              type: array
              uniqueItems: true
              description: 함께 다이빙한 친구의 사용자 ID 목록
              items:
                type: integer
                format: int64

    DiveLogSummary:
      allOf:
        - $ref: '#/components/schemas/DiveLogBase'
        - type: object
          required: [id, gasMetrics, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            gasMetrics:
              $ref: '#/components/schemas/GasMetrics'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DiveLogDetail:
      allOf:
        - $ref: '#/components/schemas/DiveLogSummary'
        - type: object
          properties:
            conditions:
              $ref: '#/components/schemas/DiveConditions'
            weighting:
              $ref: '#/components/schemas/DiveWeighting'
            equipment:
              type: array
              items:
                $ref: '#/components/schemas/DiveLogEquipmentInput'
            buddies:
              type: array
              items:
                $ref: '#/components/schemas/PublicUser'

    PublicUser:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        profileImageUrl:
          type: string
          format: uri
          nullable: true

    Friend:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [friendsSince]
          properties:
            friendsSince:
              type: string
              format: date-time

    CreateFriendRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 친구로 추가할 가입자의 로그인 이메일

    FriendRequest:
      type: object
      required: [id, requester, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        requester:
          $ref: '#/components/schemas/PublicUser'
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time

    DiveLogPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiveLogSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    SimilarDiveLog:
      type: object
      required: [log, similarityReason, sacDifferenceBarPerMin, rmvDifferenceLPerMin]
      properties:
        log:
          $ref: '#/components/schemas/DiveLogSummary'
        similarityReason:
          type: string
          description: 유사 기록으로 선택된 조건 설명
        sacDifferenceBarPerMin:
          type: number
          format: double
        rmvDifferenceLPerMin:
          type: number
          format: double

    Dashboard:
      type: object
      required: [totalDiveCount]
      properties:
        totalDiveCount:
          type: integer
          minimum: 0
        totalDiveMinutes:
          type: integer
          minimum: 0
        maximumDepthM:
          type: number
          format: double
          minimum: 0
          nullable: true
        recentDive:
          allOf:
            - $ref: '#/components/schemas/DiveLogSummary'
          nullable: true

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
