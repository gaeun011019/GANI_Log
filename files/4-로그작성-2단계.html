<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그 작성 - 2단계</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
        background: #f1efe8;
        color: #2c2c2a;
      }
      .page {
        width: 1280px;
        min-height: 800px;
        margin: 0 auto;
        background: #f1efe8;
        position: relative;
      }
      .card {
        background: #fdfdfb;
        border-radius: 12px;
      }
      .content {
        background: #ffffff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #e4e1d6;
        background: transparent;
        color: #2c2c2a;
        cursor: pointer;
      }
      .btn-primary {
        background: #2c2c2a;
        color: #ffffff;
        border: none;
      }
      .input {
        width: 100%;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #2c2c2a;
      }
      .input::placeholder {
        color: #888780;
      }
      .label {
        font-size: 12px;
        color: #5f5e5a;
        margin-bottom: 6px;
        display: block;
      }
      .muted {
        color: #888780;
        font-size: 11px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .sidebar {
        width: 190px;
        background: #fdfdfb;
        border-right: 0.5px solid #e4e1d6;
        padding: 20px 14px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .sidelink {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5f5e5a;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .sidelink.active {
        color: #0c447c;
        background: #e6f1fb;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .content-area {
        margin-left: 190px;
        background: #ffffff;
        min-height: 800px;
        padding: 24px 32px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sidebar">
        <p style="font-size: 15px; font-weight: 500; margin-bottom: 24px">
          GANI Log
        </p>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="sidelink active"><span class="dot"></span>대시보드</div>
          <div class="sidelink"><span class="dot"></span>로그 목록</div>
          <div class="sidelink"><span class="dot"></span>장비 관리</div>
          <div class="sidelink"><span class="dot"></span>내 정보</div>
        </div>
      </div>
      <div class="content-area">
        <p style="font-size: 18px; font-weight: 500; margin-bottom: 4px">
          새 로그 작성
        </p>
        <p class="muted" style="margin-bottom: 18px">
          다이브 컴퓨터에서 가져온 값을 확인하고 누락된 항목을 채워주세요.
        </p>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
          "
        >
          <span style="font-size: 12px; color: #5f5e5a; white-space: nowrap"
            >2 / 4 단계 · 연동 데이터 확인</span
          >
          <div
            style="
              width: 240px;
              height: 4px;
              background: #e4e1d6;
              border-radius: 2px;
              overflow: hidden;
            "
          >
            <div style="width: 50%; height: 100%; background: #378add"></div>
          </div>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(2, 280px);
            gap: 12px;
            margin-bottom: 16px;
          "
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #fdfdfb;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">다이빙 날짜</span
            ><span style="font-size: 13px; color: #2c2c2a; font-weight: 400"
              >2026.08.15</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #fdfdfb;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">최대 수심</span
            ><span style="font-size: 13px; color: #2c2c2a; font-weight: 400"
              >24.3m</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #fdfdfb;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">평균 수심</span
            ><span style="font-size: 13px; color: #2c2c2a; font-weight: 400"
              >14.8m</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #fdfdfb;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">다이빙 시간</span
            ><span style="font-size: 13px; color: #2c2c2a; font-weight: 400"
              >41분</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #fdfdfb;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">수온</span
            ><span style="font-size: 13px; color: #2c2c2a; font-weight: 400"
              >28°C</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #faeeda;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #633806"
              >탱크 압력 (시작/종료)</span
            ><span style="font-size: 13px; color: #633806; font-weight: 500"
              >누락됨</span
            >
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
              background: #faeeda;
              border-radius: 8px;
            "
          >
            <span style="font-size: 13px; color: #633806">웨이트 상태</span
            ><span style="font-size: 13px; color: #633806; font-weight: 500"
              >누락됨</span
            >
          </div>
        </div>
        <p class="muted" style="margin-bottom: 16px">
          누락 항목은 다음 단계에서 직접 입력합니다.
        </p>
        <div style="display: flex; gap: 8px; max-width: 240px">
          <button class="btn" style="flex: 1">이전</button>
          <button class="btn btn-primary" style="flex: 1">다음</button>
        </div>
      </div>
    </div>
    <script src="prototype.js?v=13"></script>
  </body>
</html>
