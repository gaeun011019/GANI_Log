<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버디 로그</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;background:#f1efe8;color:#2c2c2a}.page{max-width:1280px;min-height:100vh;margin:auto;background:#fff;display:flex}.sidebar{width:190px;background:#fdfdfb;padding:20px 14px;border-right:1px solid #e4e1d6}.logo{font-size:15px;font-weight:600;margin:0 10px 24px}.sidelink{padding:8px 10px;color:#5f5e5a;font-size:13px;border-radius:8px}.sidelink.active{color:#0c447c;background:#e6f1fb}.content{flex:1;padding:28px 34px;max-width:960px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.title{font-size:20px;margin:0 0 5px}.muted,.empty{font-size:12px;color:#888780}.filter{border:1px solid #d8d5ca;border-radius:8px;padding:9px 12px;background:#fff}.log-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.buddy-card{border:1px solid #e4e1d6;border-radius:12px;padding:17px}.card-head{display:flex;align-items:center;gap:9px}.card-head>div{flex:1}.card-head strong,.card-head small{display:block;font-size:12px}.card-head small{color:#888780;margin-top:3px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e6f1fb;color:#0c447c}.scope{font-size:11px;border-radius:20px;padding:4px 8px}.scope.friends{color:#0c447c;background:#e6f1fb}.scope.public{color:#3b6d11;background:#eaf3de}.buddy-card h2{font-size:15px;margin:16px 0 6px}.buddy-card p{font-size:12px;color:#5f5e5a;margin:0}@media(max-width:700px){.sidebar{display:none}.content{padding:20px}.heading{align-items:start;gap:12px}.log-grid{grid-template-columns:1fr}}
</style></head><body><div class="page"><aside class="sidebar"><p class="logo">GANI Log</p><div class="sidelink">● 대시보드</div><div class="sidelink">● 로그 목록</div><div class="sidelink">● 친구 · 공유</div><div class="sidelink active">● 버디 로그</div><div class="sidelink">● 장비 관리</div><div class="sidelink">● 내 정보</div></aside><main class="content"><div class="heading"><div><h1 class="title">버디 로그</h1><p class="muted">친구가 공유했거나 전체 공개한 다이빙 기록을 확인하세요.</p></div><select id="buddy-log-filter" class="filter" aria-label="공개 범위 필터"><option value="all">전체</option><option value="friends">친구 공개</option><option value="public">전체 공개</option></select></div><section id="buddy-log-list" class="log-grid"></section></main></div><script src="prototype.js?v=7"></script></body></html>
