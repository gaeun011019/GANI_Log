<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연동 시작</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif; background:#F1EFE8; color:#2C2C2A; }
.page { width:1280px; min-height:800px; margin:0 auto; background:#F1EFE8; position:relative; }
.card { background:#FDFDFB; border-radius:12px; }
.content { background:#FFFFFF; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid #E4E1D6; background:transparent; color:#2C2C2A; cursor:pointer; }
.btn-primary { background:#2C2C2A; color:#FFFFFF; border:none; }
.input { width:100%; height:40px; border-radius:8px; border:1px solid #E4E1D6; background:#FFFFFF; padding:0 12px; font-size:13px; color:#2C2C2A; }
.input::placeholder { color:#888780; }
.label { font-size:12px; color:#5F5E5A; margin-bottom:6px; display:block; }
.muted { color:#888780; font-size:11px; }
.badge { display:inline-block; font-size:11px; font-weight:500; padding:4px 12px; border-radius:999px; }
.sidebar { width:190px; background:#FDFDFB; border-right:0.5px solid #E4E1D6; padding:20px 14px; position:absolute; left:0; top:0; bottom:0; }
.sidelink { display:flex; align-items:center; gap:8px; font-size:13px; color:#5F5E5A; padding:8px 10px; border-radius:8px; }
.sidelink.active { color:#0C447C; background:#E6F1FB; font-weight:500; }
.dot { width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
.content-area { margin-left:190px; background:#FFFFFF; min-height:800px; padding:24px 32px; }
</style>
<link rel="stylesheet" href="readability.css">
</head>
<body>
<div class="page">

<div style="display:flex;align-items:center;justify-content:center;min-height:800px">
  <div class="card" style="width:460px;padding:32px;border:1px solid #E4E1D6">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:12px;color:#5F5E5A;white-space:nowrap">1 / 4 단계 · 연동 방식 선택</span>
      <div style="flex:1;height:4px;background:#E4E1D6;border-radius:2px;overflow:hidden">
        <div style="width:25%;height:100%;background:#378ADD"></div>
      </div>
    </div>
    <p style="font-size:17px;font-weight:500;margin-bottom:4px">다이브 컴퓨터 연동하기</p>
    <p class="muted" style="margin-bottom:18px">기록을 가져올 방법을 선택하세요.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #378ADD;background:#E6F1FB;border-radius:10px;">
  <span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #5F5E5A;display:inline-block;flex-shrink:0"></span>
  <div style="flex:1">
    <p style="font-size:13px;font-weight:500">블루투스로 직접 연결</p>
    <p class="muted">지원 기기와 근거리에서 자동으로 기록을 가져옵니다.</p>
  </div>
  <span style="width:16px;height:16px;border-radius:50%;background:#378ADD;display:inline-block"></span>
</div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #E4E1D6;background:#FFFFFF;border-radius:10px;">
  <span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #5F5E5A;display:inline-block;flex-shrink:0"></span>
  <div style="flex:1">
    <p style="font-size:13px;font-weight:500">로그 파일 업로드</p>
    <p class="muted">다이브 컴퓨터에서 내보낸 파일(.fit, .csv 등)을 올립니다.</p>
  </div>
  
</div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #E4E1D6;background:#FFFFFF;border-radius:10px;opacity:0.55;">
  <span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #5F5E5A;display:inline-block;flex-shrink:0"></span>
  <div style="flex:1">
    <p style="font-size:13px;font-weight:500">제조사 계정 연동</p>
    <p class="muted">일부 제조사만 지원 예정입니다.</p>
  </div>
  <span class="muted">준비 중</span>
</div>
    </div>
    <div style="background:#FAEEDA;border-radius:8px;padding:10px 12px;margin-bottom:18px">
      <p style="font-size:11px;color:#633806">지원하지 않는 기기나 형식은 연동 시 안내됩니다.</p>
    </div>
    <div style="display:flex;gap:8px;max-width:240px">
      <button class="btn" style="flex:1">취소</button>
      <button class="btn btn-primary" style="flex:1">다음</button>
    </div>
  </div>
</div>
</div>
</body>
</html>
