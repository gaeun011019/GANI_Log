<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>연동 시작</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
        background: #f1efe8;
        color: #2c2c2a;
      }
      .page {
        width: 1280px;
        min-height: 800px;
        margin: 0 auto;
        background: #f1efe8;
        position: relative;
      }
      .card {
        background: #fdfdfb;
        border-radius: 12px;
      }
      .content {
        background: #ffffff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #e4e1d6;
        background: transparent;
        color: #2c2c2a;
        cursor: pointer;
      }
      .btn-primary {
        background: #2c2c2a;
        color: #ffffff;
        border: none;
      }
      .input {
        width: 100%;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #2c2c2a;
      }
      .input::placeholder {
        color: #888780;
      }
      .label {
        font-size: 12px;
        color: #5f5e5a;
        margin-bottom: 6px;
        display: block;
      }
      .muted {
        color: #888780;
        font-size: 11px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .sidebar {
        width: 190px;
        background: #fdfdfb;
        border-right: 0.5px solid #e4e1d6;
        padding: 20px 14px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .sidelink {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5f5e5a;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .sidelink.active {
        color: #0c447c;
        background: #e6f1fb;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .content-area {
        margin-left: 190px;
        background: #ffffff;
        min-height: 800px;
        padding: 24px 32px;
      }
      .sync-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        border-radius: 10px;
        cursor: pointer;
      }
      .sync-option.selected {
        border-color: #378add;
        background: #e6f1fb;
      }
      .sync-option:has(.sync-radio:checked) {
        border-color: #378add;
        background: #e6f1fb;
      }
      .sync-option:focus-visible {
        outline: 2px solid #378add;
        outline-offset: 2px;
      }
      .sync-radio {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 1.5px solid #b4b2aa;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .sync-radio:checked {
        border-color: #378add;
        background: #378add;
        box-shadow: inset 0 0 0 4px #e6f1fb;
      }
      .upload-panel {
        display: none;
        padding: 14px;
        border: 1px dashed #b4b2aa;
        border-radius: 10px;
        background: #fdfdfb;
      }
      .upload-panel.open {
        display: block;
      }
      .upload-preview {
        display: none;
        max-width: 100%;
        max-height: 180px;
        margin-top: 10px;
        border-radius: 8px;
        object-fit: contain;
      }
      .upload-preview.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 800px;
        "
      >
        <div
          class="card"
          style="width: 460px; padding: 32px; border: 1px solid #e4e1d6"
        >
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-bottom: 6px;
            "
          >
            <span style="font-size: 12px; color: #5f5e5a; white-space: nowrap"
              >1 / 4 단계 · 연동 방식 선택</span
            >
            <div
              style="
                flex: 1;
                height: 4px;
                background: #e4e1d6;
                border-radius: 2px;
                overflow: hidden;
              "
            >
              <div style="width: 25%; height: 100%; background: #378add"></div>
            </div>
          </div>
          <p style="font-size: 17px; font-weight: 500; margin-bottom: 4px">
            다이브 컴퓨터 연동하기
          </p>
          <p class="muted" style="margin-bottom: 18px">
            기록을 가져올 방법을 선택하세요.
          </p>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 8px;
              margin-bottom: 16px;
            "
          >
            <label
              class="sync-option"
              data-sync-method="bluetooth"
              role="radio"
              aria-checked="true"
              tabindex="0"
              style="
              "
            >
              <span
                style="
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  border: 1.5px solid #5f5e5a;
                  display: inline-block;
                  flex-shrink: 0;
                "
              ></span>
              <div style="flex: 1">
                <p style="font-size: 13px; font-weight: 500">
                  블루투스로 직접 연결
                </p>
                <p class="muted">
                  지원 기기와 근거리에서 자동으로 기록을 가져옵니다.
                </p>
              </div>
              <input class="sync-radio" type="radio" name="sync-method" value="bluetooth" checked />
            </label>
            <label
              class="sync-option"
              data-sync-method="file"
              role="radio"
              aria-checked="false"
              tabindex="0"
              style="
              "
            >
              <span
                style="
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  border: 1.5px solid #5f5e5a;
                  display: inline-block;
                  flex-shrink: 0;
                "
              ></span>
              <div style="flex: 1">
                <p style="font-size: 13px; font-weight: 500">
                  로그 파일 업로드
                </p>
                <p class="muted">
                  다이브 컴퓨터에서 내보낸 파일(.fit, .csv 등)을 올립니다.
                </p>
              </div>
              <input class="sync-radio" type="radio" name="sync-method" value="file" />
            </label>
            <div id="log-upload-panel" class="upload-panel">
              <label class="label" for="log-file-input">로그 또는 이미지 선택</label>
              <input
                id="log-file-input"
                class="input"
                type="file"
                accept=".fit,.csv,image/jpeg,image/png,image/webp,image/heic,image/heif"
              />
              <p id="log-file-info" class="muted" style="margin-top: 8px">
                FIT, CSV, JPG, PNG, WEBP, HEIC 파일을 선택할 수 있습니다.
              </p>
              <img id="log-image-preview" class="upload-preview" alt="선택한 로그 이미지 미리보기" />
              <p id="log-upload-error" style="min-height: 16px; margin-top: 6px; color: #a32d2d; font-size: 11px"></p>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px;
                border: 1px solid #e4e1d6;
                background: #ffffff;
                border-radius: 10px;
                opacity: 0.55;
              "
            >
              <span
                style="
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  border: 1.5px solid #5f5e5a;
                  display: inline-block;
                  flex-shrink: 0;
                "
              ></span>
              <div style="flex: 1">
                <p style="font-size: 13px; font-weight: 500">
                  제조사 계정 연동
                </p>
                <p class="muted">일부 제조사만 지원 예정입니다.</p>
              </div>
              <span class="muted">준비 중</span>
            </div>
          </div>
          <div
            style="
              background: #faeeda;
              border-radius: 8px;
              padding: 10px 12px;
              margin-bottom: 18px;
            "
          >
            <p style="font-size: 11px; color: #633806">
              지원하지 않는 기기나 형식은 연동 시 안내됩니다.
            </p>
          </div>
          <div style="display: flex; gap: 8px; max-width: 240px">
            <button class="btn" style="flex: 1">취소</button>
            <button id="sync-next-button" class="btn btn-primary" style="flex: 1">다음</button>
          </div>
        </div>
      </div>
    </div>
    <script src="prototype.js?v=11"></script>
  </body>
</html>
