<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
        background: #f1efe8;
        color: #2c2c2a;
      }
      .page {
        width: 1280px;
        min-height: 800px;
        margin: 0 auto;
        background: #f1efe8;
        position: relative;
      }
      .card {
        background: #fdfdfb;
        border-radius: 12px;
      }
      .content {
        background: #ffffff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #e4e1d6;
        background: transparent;
        color: #2c2c2a;
        cursor: pointer;
      }
      .btn-primary {
        background: #2c2c2a;
        color: #ffffff;
        border: none;
      }
      .input {
        width: 100%;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #2c2c2a;
      }
      .input::placeholder {
        color: #888780;
      }
      .label {
        font-size: 12px;
        color: #5f5e5a;
        margin-bottom: 6px;
        display: block;
      }
      .muted {
        color: #888780;
        font-size: 11px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .sidebar {
        width: 190px;
        background: #fdfdfb;
        border-right: 0.5px solid #e4e1d6;
        padding: 20px 14px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .sidelink {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5f5e5a;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .sidelink.active {
        color: #0c447c;
        background: #e6f1fb;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .content-area {
        margin-left: 190px;
        background: #ffffff;
        min-height: 800px;
        padding: 24px 32px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 800px;
        "
      >
        <div
          class="card"
          style="width: 340px; padding: 32px; border: 1px solid #e4e1d6"
        >
          <p
            style="
              font-size: 20px;
              font-weight: 500;
              text-align: center;
              margin-bottom: 4px;
            "
          >
            계정 만들기
          </p>
          <p
            style="
              font-size: 13px;
              color: #5f5e5a;
              text-align: center;
              margin-bottom: 24px;
            "
          >
            이메일과 비밀번호로 시작하세요
          </p>
          <label class="label">이메일</label>
          <input
            class="input"
            placeholder="name@example.com"
            style="margin-bottom: 14px"
          />
          <label class="label">비밀번호</label>
          <input
            class="input"
            type="password"
            placeholder="8자 이상 입력하세요"
            style="margin-bottom: 14px"
          />
          <label class="label">비밀번호 확인</label>
          <input
            class="input"
            type="password"
            placeholder="비밀번호를 한 번 더 입력하세요"
            style="margin-bottom: 20px"
          />
          <button
            class="btn btn-primary"
            style="width: 100%; margin-bottom: 14px"
          >
            가입하기
          </button>
          <p style="font-size: 12px; color: #888780; text-align: center">
            이미 계정이 있으신가요? <span style="color: #0c447c">로그인</span>
          </p>
        </div>
      </div>
    </div>
    <script src="prototype.js"></script>
  </body>
</html>
