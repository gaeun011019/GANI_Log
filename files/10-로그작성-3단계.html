<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그 작성 - 3단계</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;background:#f1efe8;color:#2c2c2a}.page{width:1280px;min-height:800px;margin:0 auto;background:#f1efe8;position:relative}.sidebar{width:190px;background:#fdfdfb;padding:20px 14px;border-right:0.5px solid #e4e1d6;position:absolute;left:0;top:0;bottom:0}.logo{font-size:15px;font-weight:500;margin:0 0 24px}.sidelink{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:2px;color:#5f5e5a;font-size:13px;border-radius:8px}.sidelink.active{color:#0c447c;background:#e6f1fb}.content{margin-left:190px;min-height:800px;background:#fff;padding:24px 32px}.title{font-size:18px;font-weight:600;margin:0 0 4px}.muted{color:#888780;font-size:12px}.progress{display:flex;align-items:center;gap:8px;margin:18px 0}.bar{width:240px;height:4px;background:#e4e1d6;border-radius:4px}.bar span{display:block;width:75%;height:100%;background:#378add}.form{max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.field label{display:block;font-size:12px;color:#5f5e5a;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8d5ca;border-radius:8px;background:#fff;padding:10px 12px;font:inherit;font-size:13px}.field textarea{height:92px;resize:vertical}.wide{grid-column:1/-1}.unit{position:relative}.unit input{padding-right:44px}.unit span{position:absolute;right:12px;top:11px;color:#888780;font-size:12px}.buddy-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buddy-option{display:flex!important;align-items:center;gap:10px;border:1px solid #e4e1d6;border-radius:8px;padding:10px!important;margin:0!important}.buddy-option input{width:auto}.buddy-option span{font-size:13px}.buddy-option small{display:block;color:#888780;margin-top:2px}.helper{font-size:11px;color:#888780;margin:6px 0 0}.error{grid-column:1/-1;color:#a32d2d;font-size:12px;min-height:18px}.actions{display:flex;gap:8px;margin-top:8px}.btn{height:40px;padding:0 18px;border:1px solid #e4e1d6;border-radius:8px;background:#fff;cursor:pointer}.primary{background:#2c2c2a;color:#fff;border-color:#2c2c2a}@media(max-width:700px){.sidebar{display:none}.content{padding:20px}.form{grid-template-columns:1fr}.wide{grid-column:auto}.buddy-list{grid-template-columns:1fr}}
</style></head><body><div class="page"><aside class="sidebar"><p class="logo">GANI Log</p><div class="sidelink active">● 대시보드</div><div class="sidelink">● 로그 목록</div><div class="sidelink">● 장비 관리</div><div class="sidelink">● 내 정보</div></aside><main class="content"><h1 class="title">새 로그 작성</h1><p class="muted">연동으로 가져오지 못한 정보와 다이빙 상태를 입력해 주세요.</p><div class="progress"><span class="muted">3 / 4 단계 · 추가 정보 입력</span><div class="bar"><span></span></div></div><form id="log-details-form" class="form">
<div class="field"><label for="tank-volume">탱크 용량</label><div class="unit"><input id="tank-volume" type="number" min="1" step="0.1" required><span>L</span></div></div><div class="field"><label for="weight">웨이트 무게</label><div class="unit"><input id="weight" type="number" min="0" step="0.1" required><span>kg</span></div></div><div class="field"><label for="start-pressure">시작 압력</label><div class="unit"><input id="start-pressure" type="number" min="1" required><span>bar</span></div></div><div class="field"><label for="end-pressure">종료 압력</label><div class="unit"><input id="end-pressure" type="number" min="0" required><span>bar</span></div></div><div class="field"><label for="equipment">사용 장비</label><input id="equipment"></div><div class="field"><label for="weight-state">웨이트 상태</label><select id="weight-state"><option value="">선택 안 함</option><option>가벼웠음</option><option>적절했음</option><option>무거웠음</option></select></div><div class="field"><label for="water">수역</label><select id="water"><option value="">선택 안 함</option><option>바닷물</option><option>민물</option></select></div><div class="field"><label for="current">조류</label><select id="current"><option value="">선택 안 함</option><option>없음</option><option>약함</option><option>보통</option><option>강함</option></select></div>
<div class="field wide"><label>함께한 버디</label><div id="buddy-list" class="buddy-list"></div><p class="helper">친구로 등록된 사용자만 선택할 수 있습니다.</p></div><div class="field wide"><label for="visibility">공개 범위</label><select id="visibility"><option value="private">나만 보기</option><option value="friends">친구 공개</option><option value="public">전체 공개</option></select><p class="helper">친구 공개는 수락된 친구만, 전체 공개는 누구나 볼 수 있습니다.</p></div><div class="field wide"><label for="memo">메모</label><textarea id="memo"></textarea></div><p id="log-details-error" class="error" aria-live="polite"></p><div class="actions wide"><button class="btn" type="button" id="log-step3-back">이전</button><button class="btn primary" type="submit">다음</button></div></form></main></div><script src="prototype.js?v=13"></script></body></html>
