<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GANI Log 화면 모음</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f1efe8;
        color: #2c2c2a;
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      }

      main {
        width: min(1600px, 100%);
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      header p {
        margin: 0;
        color: #66655f;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 24px;
      }

      .screen {
        overflow: hidden;
        border: 1px solid #dedbd0;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(44, 44, 42, 0.08);
      }

      .screen-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #dedbd0;
      }

      .screen-title h2 {
        margin: 0;
        font-size: 15px;
      }

      .screen-title a {
        color: #0c447c;
        font-size: 13px;
        text-decoration: none;
      }

      .screen-title a:hover {
        text-decoration: underline;
      }

      .preview {
        position: relative;
        width: 100%;
        overflow: hidden;
        background: #f1efe8;
      }

      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 800px;
        border: 0;
        transform-origin: top left;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>GANI Log 화면 모음</h1>
        <p>
          전체 화면을 한 페이지에서 확인하고, 필요한 화면은 새 탭으로 크게 열 수
          있습니다.
        </p>
      </header>

      <section class="gallery" aria-label="GANI Log 화면 미리보기">
        <article class="screen">
          <div class="screen-title">
            <h2>1. 로그인</h2>
            <a href="1-로그인.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="1-로그인.html" title="로그인 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>2. 회원가입</h2>
            <a href="2-회원가입.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="2-회원가입.html" title="회원가입 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>3. 연동 시작</h2>
            <a href="3-연동시작.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="3-연동시작.html" title="연동 시작 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>4. 로그 작성 2단계</h2>
            <a href="4-로그작성-2단계.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe
              src="4-로그작성-2단계.html"
              title="로그 작성 2단계 화면"
            ></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>5. 대시보드</h2>
            <a href="5-대시보드.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="5-대시보드.html" title="대시보드 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>6. 로그 목록</h2>
            <a href="6-로그목록.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="6-로그목록.html" title="로그 목록 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>7. 로그 상세</h2>
            <a href="7-로그상세.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="7-로그상세.html" title="로그 상세 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>8. 장비 관리</h2>
            <a href="8-장비관리.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="8-장비관리.html" title="장비 관리 화면"></iframe>
          </div>
        </article>
        <article class="screen">
          <div class="screen-title">
            <h2>9. 내 정보</h2>
            <a href="9-내정보.html" target="_blank">크게 보기</a>
          </div>
          <div class="preview">
            <iframe src="9-내정보.html" title="내 정보 화면"></iframe>
          </div>
        </article>
      </section>
    </main>

    <script>
      function resizePreviews() {
        document.querySelectorAll(".preview").forEach((preview) => {
          const scale = preview.clientWidth / 1280;
          const iframe = preview.querySelector("iframe");
          preview.style.height = `${800 * scale}px`;
          iframe.style.transform = `scale(${scale})`;
        });
      }

      window.addEventListener("resize", resizePreviews);
      resizePreviews();
    </script>
  </body>
</html>
