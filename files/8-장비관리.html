<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장비 관리</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif; background:#F1EFE8; color:#2C2C2A; }
.page { width:1280px; min-height:800px; margin:0 auto; background:#F1EFE8; position:relative; }
.card { background:#FDFDFB; border-radius:12px; }
.content { background:#FFFFFF; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:40px; padding:0 16px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid #E4E1D6; background:transparent; color:#2C2C2A; cursor:pointer; }
.btn-primary { background:#2C2C2A; color:#FFFFFF; border:none; }
.input { width:100%; height:40px; border-radius:8px; border:1px solid #E4E1D6; background:#FFFFFF; padding:0 12px; font-size:13px; color:#2C2C2A; }
.input::placeholder { color:#888780; }
.label { font-size:12px; color:#5F5E5A; margin-bottom:6px; display:block; }
.muted { color:#888780; font-size:11px; }
.badge { display:inline-block; font-size:11px; font-weight:500; padding:4px 12px; border-radius:999px; }
.sidebar { width:190px; background:#FDFDFB; border-right:0.5px solid #E4E1D6; padding:20px 14px; position:absolute; left:0; top:0; bottom:0; }
.sidelink { display:flex; align-items:center; gap:8px; font-size:13px; color:#5F5E5A; padding:8px 10px; border-radius:8px; }
.sidelink.active { color:#0C447C; background:#E6F1FB; font-weight:500; }
.dot { width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block; }
.content-area { margin-left:190px; background:#FFFFFF; min-height:800px; padding:24px 32px; }
</style>
<link rel="stylesheet" href="readability.css">
</head>
<body>
<div class="page">

<div class="sidebar">
<p style="font-size:15px;font-weight:500;margin-bottom:24px">GANI Log</p>
<div style="display:flex;flex-direction:column;gap:2px">
<div class="sidelink"><span class="dot"></span>대시보드</div>
<div class="sidelink"><span class="dot"></span>로그 목록</div>
<div class="sidelink active"><span class="dot"></span>장비 관리</div>
<div class="sidelink"><span class="dot"></span>내 정보</div>

</div>
</div>
<div class="content-area">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <p style="font-size:18px;font-weight:500">장비 관리</p>
    <button class="btn btn-primary">+ 장비 등록</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
    <div class="card" style="padding:16px">
  <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid #378ADD;margin-bottom:8px"></div>
  <p style="font-size:13px;font-weight:500;margin-bottom:2px">3mm 웻슈트</p>
  <p style="font-size:12px;color:#5F5E5A">종류: 슈트</p>
</div><div class="card" style="padding:16px">
  <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid #378ADD;margin-bottom:8px"></div>
  <p style="font-size:13px;font-weight:500;margin-bottom:2px">Aqualung BCD</p>
  <p style="font-size:12px;color:#5F5E5A">종류: BCD</p>
</div><div class="card" style="padding:16px">
  <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid #378ADD;margin-bottom:8px"></div>
  <p style="font-size:13px;font-weight:500;margin-bottom:2px">알루미늄 탱크 12L</p>
  <p style="font-size:12px;color:#5F5E5A">종류: 탱크</p>
</div><div class="card" style="padding:16px">
  <div style="width:20px;height:20px;border-radius:50%;border:1.5px solid #378ADD;margin-bottom:8px"></div>
  <p style="font-size:13px;font-weight:500;margin-bottom:2px">웨이트 벨트 6kg</p>
  <p style="font-size:12px;color:#5F5E5A">종류: 웨이트</p>
</div>
    <div style="border:1px dashed #E4E1D6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#888780;font-size:12px;min-height:76px">+ 장비 추가</div>
  </div>
</div>
</div>
</body>
</html>
