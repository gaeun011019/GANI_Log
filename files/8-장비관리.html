<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>장비 관리</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
        background: #f1efe8;
        color: #2c2c2a;
      }
      .page {
        width: 1280px;
        min-height: 800px;
        margin: 0 auto;
        background: #f1efe8;
        position: relative;
      }
      .card {
        background: #fdfdfb;
        border-radius: 12px;
      }
      .content {
        background: #ffffff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #e4e1d6;
        background: transparent;
        color: #2c2c2a;
        cursor: pointer;
      }
      .btn-primary {
        background: #2c2c2a;
        color: #ffffff;
        border: none;
      }
      .input {
        width: 100%;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #2c2c2a;
      }
      .input::placeholder {
        color: #888780;
      }
      .label {
        font-size: 12px;
        color: #5f5e5a;
        margin-bottom: 6px;
        display: block;
      }
      .muted {
        color: #888780;
        font-size: 11px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .sidebar {
        width: 190px;
        background: #fdfdfb;
        border-right: 0.5px solid #e4e1d6;
        padding: 20px 14px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .sidelink {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5f5e5a;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .sidelink.active {
        color: #0c447c;
        background: #e6f1fb;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .content-area {
        margin-left: 190px;
        background: #ffffff;
        min-height: 800px;
        padding: 24px 32px;
      }
      .equipment-form {
        display: none;
        max-width: 760px;
        margin-bottom: 20px;
        padding: 18px;
        border: 1px solid #e4e1d6;
        border-radius: 12px;
        background: #fdfdfb;
      }
      .equipment-form.open {
        display: block;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 180px 200px;
        gap: 12px;
      }
      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .form-error {
        min-height: 17px;
        margin-top: 8px;
        color: #a32d2d;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sidebar">
        <p style="font-size: 15px; font-weight: 500; margin-bottom: 24px">
          GANI Log
        </p>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="sidelink"><span class="dot"></span>대시보드</div>
          <div class="sidelink"><span class="dot"></span>로그 목록</div>
          <div class="sidelink active"><span class="dot"></span>장비 관리</div>
          <div class="sidelink"><span class="dot"></span>내 정보</div>
        </div>
      </div>
      <div class="content-area">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <p style="font-size: 18px; font-weight: 500">장비 관리</p>
          <button id="open-equipment-form-button" class="btn btn-primary">
            + 장비 등록
          </button>
        </div>
        <form id="equipment-form" class="equipment-form" novalidate>
          <div class="form-grid">
            <div>
              <label class="label" for="equipment-name-input">장비 이름</label>
              <input
                id="equipment-name-input"
                class="input"
                name="name"
                placeholder="예: 5mm 웻슈트"
                required
              />
            </div>
            <div>
              <label class="label" for="equipment-type-input">장비 종류</label>
              <select
                id="equipment-type-input"
                class="input"
                name="type"
                required
              >
                <option value="">선택하세요</option>
                <option value="슈트">슈트</option>
                <option value="BCD">BCD</option>
                <option value="탱크">탱크</option>
                <option value="웨이트">웨이트</option>
                <option value="호흡기">호흡기</option>
                <option value="핀">핀</option>
                <option value="마스크">마스크</option>
                <option value="다이브 컴퓨터">다이브 컴퓨터</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div>
              <label class="label" for="equipment-subtype-input"
                >세부 종류</label
              >
              <select
                id="equipment-subtype-input"
                class="input"
                name="subtype"
                required
                disabled
              >
                <option value="">장비 종류를 먼저 선택하세요</option>
              </select>
            </div>
          </div>
          <p id="equipment-form-error" class="form-error" role="alert"></p>
          <div class="form-actions">
            <button id="cancel-equipment-button" class="btn" type="button">
              취소
            </button>
            <button class="btn btn-primary" type="submit">저장</button>
          </div>
        </form>
        <div
          id="equipment-grid"
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
          "
        >
          <div class="card" style="padding: 16px">
            <div
              style="
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1.5px solid #378add;
                margin-bottom: 8px;
              "
            ></div>
            <p style="font-size: 13px; font-weight: 500; margin-bottom: 2px">
              3mm 웻슈트
            </p>
            <p style="font-size: 12px; color: #5f5e5a">종류: 슈트</p>
          </div>
          <div class="card" style="padding: 16px">
            <div
              style="
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1.5px solid #378add;
                margin-bottom: 8px;
              "
            ></div>
            <p style="font-size: 13px; font-weight: 500; margin-bottom: 2px">
              Aqualung BCD
            </p>
            <p style="font-size: 12px; color: #5f5e5a">종류: BCD</p>
          </div>
          <div class="card" style="padding: 16px">
            <div
              style="
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1.5px solid #378add;
                margin-bottom: 8px;
              "
            ></div>
            <p style="font-size: 13px; font-weight: 500; margin-bottom: 2px">
              프레임리스 마스크
            </p>
            <p style="font-size: 12px; color: #5f5e5a">종류: 마스크</p>
          </div>
          <div class="card" style="padding: 16px">
            <div
              style="
                width: 20px;
                height: 20px;
                border-radius: 50%;
                border: 1.5px solid #378add;
                margin-bottom: 8px;
              "
            ></div>
            <p style="font-size: 13px; font-weight: 500; margin-bottom: 2px">
              오픈힐 핀
            </p>
            <p style="font-size: 12px; color: #5f5e5a">종류: 핀</p>
          </div>
          <div
            id="equipment-add-card"
            style="
              border: 1px dashed #e4e1d6;
              border-radius: 12px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #888780;
              font-size: 12px;
              min-height: 76px;
            "
          >
            + 장비 등록
          </div>
        </div>
      </div>
    </div>
    <script src="prototype.js?v=11"></script>
  </body>
</html>
