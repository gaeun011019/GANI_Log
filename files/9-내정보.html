<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>내 정보</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
        background: #f1efe8;
        color: #2c2c2a;
      }
      .page {
        width: 1280px;
        min-height: 800px;
        margin: 0 auto;
        background: #f1efe8;
        position: relative;
      }
      .card {
        background: #fdfdfb;
        border-radius: 12px;
      }
      .content {
        background: #ffffff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #e4e1d6;
        background: transparent;
        color: #2c2c2a;
        cursor: pointer;
      }
      .btn-primary {
        background: #2c2c2a;
        color: #ffffff;
        border: none;
      }
      .input {
        width: 100%;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e4e1d6;
        background: #ffffff;
        padding: 0 12px;
        font-size: 13px;
        color: #2c2c2a;
      }
      .input::placeholder {
        color: #888780;
      }
      .label {
        font-size: 12px;
        color: #5f5e5a;
        margin-bottom: 6px;
        display: block;
      }
      .muted {
        color: #888780;
        font-size: 11px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .sidebar {
        width: 190px;
        background: #fdfdfb;
        border-right: 0.5px solid #e4e1d6;
        padding: 20px 14px;
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
      }
      .sidelink {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #5f5e5a;
        padding: 8px 10px;
        border-radius: 8px;
      }
      .sidelink.active {
        color: #0c447c;
        background: #e6f1fb;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .content-area {
        margin-left: 190px;
        background: #ffffff;
        min-height: 800px;
        padding: 24px 32px;
      }
      .edit-panel {
        display: none;
        max-width: 420px;
        margin-top: 16px;
        padding: 18px;
        border: 1px solid #e4e1d6;
        border-radius: 12px;
        background: #fdfdfb;
      }
      .edit-panel.open {
        display: block;
      }
      .field {
        margin-bottom: 14px;
      }
      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .form-error {
        min-height: 17px;
        margin-top: 8px;
        color: #a32d2d;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="sidebar">
        <p style="font-size: 15px; font-weight: 500; margin-bottom: 24px">
          GANI Log
        </p>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div class="sidelink"><span class="dot"></span>대시보드</div>
          <div class="sidelink"><span class="dot"></span>로그 목록</div>
          <div class="sidelink"><span class="dot"></span>장비 관리</div>
          <div class="sidelink active"><span class="dot"></span>내 정보</div>
        </div>
      </div>
      <div class="content-area">
        <p style="font-size: 18px; font-weight: 500; margin-bottom: 20px">
          내 정보
        </p>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
          "
        >
          <div
            id="profile-avatar"
            style="
              width: 56px;
              height: 56px;
              border-radius: 50%;
              background: #e6f1fb;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 500;
              font-size: 16px;
              color: #0c447c;
            "
          >
            가은
          </div>
          <div>
            <p
              id="profile-name"
              style="font-size: 15px; font-weight: 500; margin-bottom: 2px"
            >
              김가은
            </p>
            <p id="profile-email" style="font-size: 12px; color: #5f5e5a">
              gaeun@example.com
            </p>
          </div>
        </div>
        <div
          style="
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
          "
        >
          <div
            class="card"
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a">다이빙 자격</span
            ><span id="profile-certification" style="font-size: 13px"
              >Instructor</span
            >
          </div>
          <div
            class="card"
            style="
              display: flex;
              justify-content: space-between;
              padding: 12px 14px;
            "
          >
            <span style="font-size: 13px; color: #5f5e5a"
              >연동된 다이브 컴퓨터</span
            ><span style="font-size: 13px">Shearwater Perdix2</span>
          </div>
        </div>
        <p class="muted" style="max-width: 420px; margin-bottom: 20px">
          다이빙 자격은 로그 수를 기준으로 자동 변경되지 않으며, 직접
          입력·수정합니다.
        </p>
        <button id="edit-profile-button" class="btn">정보 수정</button>
        <form id="profile-form" class="edit-panel" novalidate>
          <div class="field">
            <label class="label" for="profile-name-input">이름</label>
            <input
              id="profile-name-input"
              class="input"
              name="name"
              autocomplete="name"
              required
            />
          </div>
          <div class="field">
            <label class="label" for="profile-email-input">이메일</label>
            <input
              id="profile-email-input"
              class="input"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label class="label" for="profile-certification-input"
              >다이빙 자격</label
            >
            <input
              id="profile-certification-input"
              class="input"
              name="certification"
              placeholder="예: Advanced Open Water"
            />
          </div>
          <p id="profile-form-error" class="form-error" role="alert"></p>
          <div class="form-actions">
            <button id="cancel-profile-button" class="btn" type="button">
              취소
            </button>
            <button class="btn btn-primary" type="submit">저장</button>
          </div>
        </form>
      </div>
    </div>
    <script src="prototype.js?v=11"></script>
  </body>
</html>
